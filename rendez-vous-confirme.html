<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regain — c'est noté</title>
<meta name="robots" content="noindex">
<style>
:root{
    /* Palette du mail « Diagnostic paysage » (vert sobre) */
    --bleu:#3B6E52; --bleu-fonce:#2D5540; --bleu-pale:#EEF4EF; --bleu-bord:#D8E5DC;
    --encre:#1E2822; --encre-doux:#2C3831; --gris:#4A5850; --gris-2:#7C8A81;
    --fond:#FFFFFF; --fond-2:#F4F6F4; --bord:#E1E7E2;
    --or:#E8734A; --or-pale:#FFF4EF; --vert:#12A05C; --vert-pale:#EAF7F1;
    --r:8px; --r-s:5px;
    --ombre:0 1px 2px rgba(30,40,34,.04), 0 8px 24px rgba(30,40,34,.06);
    --ombre-fort:0 2px 4px rgba(30,40,34,.04), 0 18px 48px rgba(30,40,34,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--fond);color:var(--encre);
    font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .enveloppe{max-width:820px;margin:0 auto;padding:0 24px}

  .entete{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);
    backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--bord)}
  .entete-in{max-width:820px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:10px}
  .point{width:10px;height:10px;border-radius:50%;background:var(--bleu);
    box-shadow:0 0 0 4px var(--bleu-pale);flex:0 0 auto}
  .marque-nom{font-weight:800;letter-spacing:1.5px;font-size:11.5px;text-transform:uppercase;color:var(--bleu)}
  .marque-droite{margin-left:auto;font-size:13px;color:var(--gris-2);font-weight:600}

  .hero{padding:74px 0 54px;position:relative;overflow:hidden}
  .hero:before{content:"";position:absolute;inset:-40% 30% auto -20%;height:520px;
    background:radial-gradient(ellipse at center, rgba(59,110,82,.10), transparent 68%);
    pointer-events:none}
  .etiquette{display:inline-flex;align-items:center;gap:8px;background:var(--bleu-pale);
    border:1px solid var(--bleu-bord);color:var(--bleu-fonce);border-radius:100px;
    padding:7px 15px;font-size:13px;font-weight:700;letter-spacing:.01em;margin-bottom:26px}
  h1{font-size:clamp(32px,6.2vw,52px);line-height:1.08;letter-spacing:-.035em;
    font-weight:800;margin-bottom:22px;max-width:15ch}
  h1 em{font-style:normal;color:var(--bleu)}
  .chapeau{font-size:clamp(17px,2.3vw,19.5px);color:var(--gris);max-width:56ch;margin-bottom:34px}
  .rangee-boutons{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

  .bouton{background:var(--bleu);color:#fff;border:0;border-radius:var(--r-s);
    padding:16px 30px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;
    transition:transform .12s ease, background .15s ease, box-shadow .15s ease;
    box-shadow:0 6px 18px rgba(59,110,82,.30);white-space:nowrap}
  .bouton:hover{background:var(--bleu-fonce);transform:translateY(-1px);
    box-shadow:0 10px 26px rgba(59,110,82,.36)}
  .bouton:active{transform:translateY(0)}
  .bouton[disabled]{background:#C6D2C9;box-shadow:none;cursor:not-allowed;transform:none}
  .bouton-clair{background:#fff;color:var(--encre);border:1.5px solid var(--bord);box-shadow:none}
  .bouton-clair:hover{background:var(--fond-2);border-color:#CFDCD3;box-shadow:none}
  .bouton-lien{background:none;border:0;color:var(--gris);font:inherit;font-size:14px;
    font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:8px 0}
  .bouton-lien:hover{color:var(--bleu)}

  .carte{background:#fff;border:1px solid var(--bord);border-radius:var(--r);padding:26px;
    box-shadow:var(--ombre)}
  .carte-2{background:var(--fond-2);border:1px solid var(--bord);border-radius:var(--r);padding:26px}

  .pre-rempli{display:flex;gap:14px;align-items:flex-start;background:var(--bleu-pale);
    border:1px solid var(--bleu-bord);border-radius:var(--r);padding:18px 20px;margin-bottom:26px}
  #zone-pre-rempli-hero .pre-rempli{margin:0 0 30px;max-width:60ch}
  .pre-rempli .icone{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--bleu);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;
    font-weight:800;margin-top:1px}
  .pre-rempli p{font-size:14.5px;color:var(--encre-doux);margin:0}
  .pre-rempli strong{color:var(--encre)}

  .preuves{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:16px;margin:44px 0 0}
  .preuve{background:var(--fond-2);border:1px solid var(--bord);border-radius:var(--r);padding:22px}
  .preuve .gros{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;
    color:var(--bleu);margin-bottom:8px;font-variant-numeric:tabular-nums}
  .preuve .dit{font-size:14px;color:var(--gris);line-height:1.5}
  .preuve .src{font-size:11.5px;color:var(--gris-2);margin-top:9px;font-weight:600}

  section{padding:64px 0}
  .sep{height:1px;background:var(--bord);margin:0}
  h2{font-size:clamp(24px,3.6vw,33px);line-height:1.16;letter-spacing:-.028em;
    font-weight:800;margin-bottom:16px}
  h3{font-size:19px;letter-spacing:-.02em;font-weight:800;margin-bottom:12px}
  h4{font-size:16px;font-weight:800;margin-bottom:8px}
  .intro-section{font-size:17.5px;color:var(--gris);max-width:60ch;margin-bottom:34px}
  p+p{margin-top:14px}

  .dossier{background:#fff;border:1px solid var(--bord);border-radius:var(--r);
    overflow:hidden;box-shadow:var(--ombre-fort);margin:30px 0}
  .dossier-tete{background:var(--encre);color:#fff;padding:20px 26px;
    display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .dossier-tete .ref{font-weight:800;letter-spacing:-.01em;font-size:16px}
  .dossier-tete .montant{font-weight:800;font-size:22px;letter-spacing:-.02em;
    color:#fff;font-variant-numeric:tabular-nums}
  .dossier-tete .sous{font-size:12.5px;color:#94A3A0;font-weight:600;display:block;margin-top:2px;
    letter-spacing:.02em;text-transform:uppercase}
  .trace{padding:8px 26px 22px}
  .etape{display:grid;grid-template-columns:96px 26px 1fr;gap:0;position:relative;padding:15px 0}
  .etape .date{font-size:13px;font-weight:800;color:var(--gris);padding-top:1px;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .etape .rail{position:relative;display:flex;justify-content:center}
  .etape .rail:before{content:"";position:absolute;top:22px;bottom:-15px;width:2px;background:var(--bord)}
  .etape:last-child .rail:before{display:none}
  .etape .puce{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--bord);
    display:flex;align-items:center;justify-content:center;font-size:12px;position:relative;
    z-index:1;flex:0 0 auto}
  .etape.fait .puce{background:var(--vert-pale);border-color:var(--vert);color:var(--vert);font-weight:800}
  .etape.cle .puce{background:var(--bleu);border-color:var(--bleu);color:#fff;font-weight:800}
  .etape.attente .puce{background:var(--or-pale);border-color:var(--or);color:var(--or);font-weight:800}
  .etape .quoi{font-size:15px;font-weight:700;color:var(--encre);line-height:1.45}
  .etape .detail{font-size:13.5px;color:var(--gris);margin-top:3px;line-height:1.5}
  .etape.cle .quoi{color:var(--bleu-fonce)}
  .dossier-pied{background:var(--fond-2);border-top:1px solid var(--bord);padding:20px 26px;
    font-size:14.5px;color:var(--encre-doux)}
  .dossier-pied strong{color:var(--encre)}

  .bloc-question{margin-bottom:34px}
  .bloc-question .intitule{font-weight:700;font-size:16.5px;margin-bottom:5px;
    display:flex;align-items:baseline;gap:9px}
  .bloc-question .num{font-size:12.5px;font-weight:800;color:var(--bleu);
    background:var(--bleu-pale);border-radius:6px;padding:2px 8px;flex:0 0 auto}
  .bloc-question .aide{font-size:14px;color:var(--gris);margin-bottom:14px}
  .glissiere{display:flex;align-items:center;gap:16px}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;
    background:var(--bord);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;
    border-radius:50%;background:var(--bleu);border:3px solid #fff;
    box-shadow:0 2px 8px rgba(59,110,82,.4);cursor:grab;transition:transform .12s}
  input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.12)}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;
    background:var(--bleu);border:3px solid #fff;box-shadow:0 2px 8px rgba(59,110,82,.4);cursor:grab}
  .valeur{min-width:132px;text-align:right;font-weight:800;font-size:19px;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--encre)}

  .choix{display:flex;flex-direction:column;gap:9px}
  .choix button{text-align:left;background:#fff;border:1.5px solid var(--bord);
    border-radius:var(--r-s);padding:15px 18px;font:inherit;font-size:15px;cursor:pointer;
    transition:.14s;display:flex;align-items:flex-start;gap:12px;line-height:1.45}
  .choix button:hover{border-color:var(--bleu);background:var(--bleu-pale)}
  .choix button .case{flex:0 0 auto;width:19px;height:19px;border-radius:50%;
    border:2px solid var(--bord);margin-top:1px;transition:.14s}
  .choix button.actif{border-color:var(--bleu);background:var(--bleu-pale);font-weight:700;
    box-shadow:0 0 0 3px rgba(59,110,82,.10)}
  .choix button.actif .case{border-color:var(--bleu);background:var(--bleu);
    box-shadow:inset 0 0 0 4px #fff}

  .barre{position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--bord);padding:14px 24px;display:none;
    box-shadow:0 -6px 24px rgba(30,40,34,.05)}
  .barre.visible{display:block}
  .barre-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:18px}
  .progres{flex:1;height:5px;background:var(--bord);border-radius:6px;overflow:hidden}
  .progres span{display:block;height:100%;width:0;background:var(--bleu);
    border-radius:6px;transition:width .3s ease}
  .barre .compte{font-size:13px;font-weight:700;color:var(--gris);
    font-variant-numeric:tabular-nums;white-space:nowrap}

  .verdict{border-radius:var(--r);padding:30px;margin-bottom:34px;border:1px solid var(--bord);
    background:var(--fond-2);position:relative;overflow:hidden}
  .verdict:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--bleu)}
  .verdict.v-or:before{background:var(--or)} .verdict.v-vert:before{background:var(--vert)}
  .verdict .tete{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--gris-2);margin-bottom:8px}
  .verdict h3{font-size:clamp(22px,3.4vw,29px);letter-spacing:-.03em;margin-bottom:10px}
  .verdict p{color:var(--encre-doux);font-size:16.5px;max-width:54ch}

  .montants{background:#fff;border:1px solid var(--bord);border-radius:var(--r);
    overflow:hidden;box-shadow:var(--ombre);margin-bottom:14px}
  .ligne{display:flex;justify-content:space-between;align-items:center;gap:20px;
    padding:22px 26px;border-bottom:1px solid var(--bord)}
  .ligne:last-child{border-bottom:0}
  .ligne .gauche{display:flex;flex-direction:column;gap:3px}
  .ligne .libelle{font-size:15.5px;font-weight:700;color:var(--encre)}
  .ligne .explication{font-size:13.5px;color:var(--gris)}
  .ligne .chiffre{font-weight:800;font-size:27px;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .ligne.principal{background:var(--or-pale)}
  .chiffre.or{color:var(--or)} .chiffre.bleu{color:var(--bleu)} .chiffre.neutre{color:var(--gris)}

  .avert{font-size:13.5px;color:var(--gris);line-height:1.55}

  .hypotheses{background:var(--fond-2);border:1px solid var(--bord);border-radius:var(--r);
    padding:24px 26px;margin-top:6px}
  .hypotheses ul{list-style:none;display:flex;flex-direction:column;gap:11px}
  .hypotheses li{font-size:14.5px;color:var(--encre-doux);padding-left:22px;position:relative}
  .hypotheses li:before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;
    border-radius:50%;background:var(--bleu)}
  .hypotheses li strong{font-weight:800;color:var(--encre)}

  .capture{background:var(--encre);border-radius:var(--r);padding:34px;color:#fff}
  .capture h3{color:#fff;font-size:22px;margin-bottom:10px}
  .capture .sous{color:#94A3A0;font-size:15.5px;margin-bottom:22px;max-width:50ch}
  .champs{display:flex;gap:10px;flex-wrap:wrap}
  .champs input{flex:1;min-width:230px;padding:16px 18px;border-radius:var(--r-s);
    border:1.5px solid #33413A;background:#1E2822;color:#fff;font:inherit;font-size:15.5px}
  .champs input::placeholder{color:#64756B}
  .champs input:focus{outline:0;border-color:var(--bleu);background:#121A15}
  .accuse{margin-top:16px;font-size:14.5px;color:#94A3A0}
  .accuse.ok{color:#4ADE80;font-weight:600}
  .accuse.ko{color:#FCA5A5}

  footer{border-top:1px solid var(--bord);padding:38px 0 56px;background:var(--fond-2)}
  footer p{font-size:13.5px;color:var(--gris-2);max-width:66ch}
  footer p+p{margin-top:9px}
  footer strong{color:var(--gris)}

  .non-js{display:none}
  .nojs .js-only{display:none}
  .nojs .non-js{display:block}

  @media(max-width:640px){
    .hero{padding:52px 0 40px}
    section{padding:48px 0}
    .carte,.carte-2,.verdict{padding:22px}
    .ligne{padding:18px 20px;flex-direction:column;align-items:flex-start;gap:8px}
    .ligne .chiffre{font-size:32px}
    .valeur{min-width:96px;font-size:17px}
    .etape{grid-template-columns:74px 24px 1fr}
    .etape .date{font-size:12px}
    .trace{padding:4px 18px 18px}
    .dossier-tete{padding:16px 20px}
    .dossier-pied{padding:16px 20px}
    .barre-in{gap:12px}
    .capture{padding:24px}
  }
  .hero{padding:60px 0 30px}
  .hero h1{max-width:24ch}
  .coche{width:64px;height:64px;border-radius:50%;background:#E8F3EC;
    border:2px solid #BFDECA;display:flex;align-items:center;justify-content:center;
    font-size:30px;color:#2D5540;margin-bottom:22px}
  .rappel{background:#fff;border:1px solid var(--bord);border-left:3px solid var(--bleu);
    border-radius:0 var(--r) var(--r) 0;padding:22px 24px;margin:26px 0}
  .rappel .lib{font-size:11.5px;font-weight:700;letter-spacing:1.1px;
    text-transform:uppercase;color:var(--gris-2);margin-bottom:7px}
  .rappel .val{font-size:20px;font-weight:800;color:var(--encre);letter-spacing:-.01em}
  .libre{margin:26px 0 0;font-size:15px;line-height:1.6;color:var(--encre-doux)}
  .libre strong{color:var(--encre)}

</style>
</head>
<body>

<div class="entete"><div class="entete-in">
  <span class="point"></span><span class="marque-nom">Regain</span>
  <span class="marque-droite">Prise de contact</span>
</div></div>

<div class="hero"><div class="enveloppe">
  <div class="coche">&#10003;</div>
  <h1>C'est not&eacute;.</h1>
  <p class="chapeau">
    Votre rendez-vous est enregistr&eacute;. Vous recevez un email de confirmation
    dans la minute.
  </p>

  <div class="rappel" id="rappel" hidden>
    <div class="lib">Votre appel</div>
    <div class="val" id="creneau">&nbsp;</div>
  </div>

  <p class="libre">
    <strong>Vous pouvez fermer cette page.</strong> Rien d'autre &agrave; faire de votre c&ocirc;t&eacute;.
    Je vous appelle au num&eacute;ro que vous avez laiss&eacute;, &agrave; l'heure dite.
  </p>
  <p class="libre" style="margin-top:22px">
    &Agrave; bient&ocirc;t,<br><strong>Thomas</strong>
  </p>
</div></div>

<script>
// Le cr&eacute;neau arrive par l'adresse : ?jour=...&heure=...
var p = new URLSearchParams(window.location.search);
var jour = (p.get('jour') || '').trim();
var heure = (p.get('heure') || '').trim();
if (jour && heure){
  document.getElementById('creneau').textContent = jour + ' \u00e0 ' + heure;
  document.getElementById('rappel').hidden = false;
}
</script>

</body>
</html>
